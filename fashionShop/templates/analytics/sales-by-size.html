{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продажби по размери</title>
</head>
<body>

    <div class="container first-container">
    <a href="{% url 'home' %}">Начало</a>
    <h1 style="text-align: center;">Продажби по размери</h1>
    <table style="margin: 0 auto;">
        <thead>
            <tr>
                <th style="border: 2px solid #000; font-weight: bold; padding: 0.8em;">Размер</th>
                <th style="border: 2px solid #000; font-weight: bold; padding: 0.8em;">Продажби</th>
            </tr>
        </thead>
        <tbody>
            {% for size in sizes %}
            <tr>
                <td style="border: 1px solid #000; font-weight: bold; text-align: center;">{{ size.size }}</td>
                <td style="border: 1px solid #000; text-align: center;">{{ size.sales }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
    
</body>
</html>
