# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name vilistil.bg www.vilistil.bg;
    return 301 https://$host$request_uri;
}

# Secure HTTPS server
server {
    listen 443 ssl;
    server_name vilistil.bg www.vilistil.bg;

    ssl_certificate /etc/letsencrypt/live/vilistil.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vilistil.bg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve static files
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Serve media files
    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
    }

    # Proxy pass to Gunicorn app server
    location / {
        proxy_pass http://app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: better timeout configs
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}
