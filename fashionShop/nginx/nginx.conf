user nginx;
worker_processes auto;

pid /var/run/nginx.pid;
events {
	worker_connections 1024;
}

http {
    include mime.types;
	default_type application/octet-stream;

    error_log /var/log/nginx/error.log; # Define the location of the NGINX error log
    access_log /var/log/nginx/access.log;  # Define the location of the NGINX access log

    # Serves files in a more effective way
	sendfile on;
    # Reuse client connections for up to 65 seconds
	keepalive_timeout 65;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name vilistil.bg www.vilistil.bg;
        return 301 https://$host$request_uri;
    }

    # Secure HTTPS server
    server {
        listen 443 ssl;
        server_name vilistil.bg www.vilistil.bg;

        ssl_certificate /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Sets the maximum size of HTTP request body Nginx will accept
        client_max_body_size 10m;

        # Serve static files
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Serve media files
        location /media/ {
            alias /media/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Proxy pass to Gunicorn app server
        location / {
            proxy_pass http://app:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Wait 120s for the Guniconrn worker's job
            proxy_read_timeout 120s;
            # Wait 5s to connect to Gunicorn
            proxy_connect_timeout 5s;
        }
    }
}