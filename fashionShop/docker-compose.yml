name: vs-fashion-shop

services:
  app:
    build: .
    image: fashion-shop-image
    command: python3 manage.py runserver 0.0.0.0:8000
    container_name: fashion-shop-container
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - celery
    #restart: always
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: vs-postgres-container
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    #restart: always
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-container
    restart: unless-stopped

  celery:
    build: .
    image: fashion-shop-image
    container_name: celery-worker
    command: celery -A fashionShop worker --loglevel=info
    user: 1000:1000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  postgres_data:
